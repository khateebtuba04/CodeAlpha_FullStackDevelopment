<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexLink | Real-Time Collaboration</title>
    <meta name="description" content="NexLink — secure multi-user video conferencing with whiteboard, screen sharing, and file transfer.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- ── Auth View ────────────────────────────────── -->
    <div id="auth-view" class="full-center fade-in">
        <div class="card glass">
            <div class="logo-mark">
                <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="url(#g1)"/><path d="M12 20a8 8 0 1 1 16 0 8 8 0 0 1-16 0z" fill="rgba(255,255,255,.2)"/><path d="M20 14v6l4 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs></svg>
            </div>
            <h1 class="brand-title">NexLink</h1>
            <p class="brand-sub">Secure video collaboration for teams</p>

            <div id="auth-error" class="error-msg hidden"></div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="e.g. alex_doe" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button id="login-btn" class="btn-primary">
                <span class="btn-icon">→</span> Sign In
            </button>
            <div class="divider"><span>or</span></div>
            <button id="register-btn" class="btn-ghost">
                Create Account
            </button>
        </div>
    </div>

    <!-- ── Lobby View ────────────────────────────────── -->
    <div id="lobby-view" class="full-center fade-in hidden">
        <div class="card glass">
            <div class="logo-mark small">
                <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="url(#g2)"/><path d="M20 14v6l4 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="g2" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs></svg>
            </div>
            <h2 class="brand-title" style="font-size:1.8rem">Welcome, <span id="user-display" style="background:linear-gradient(to right,#8b5cf6,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent"></span></h2>
            <p class="brand-sub">Enter a room ID to start or join a meeting</p>

            <div class="form-group">
                <label for="room-id">Room ID</label>
                <input type="text" id="room-id" placeholder="e.g. design-sync-q4" autocomplete="off">
            </div>
            <button id="join-btn" class="btn-primary">
                <span class="btn-icon">▶</span> Join Meeting
            </button>
            <button id="logout-btn" class="btn-ghost" style="margin-top:12px">
                Sign Out
            </button>
        </div>
    </div>

    <!-- ── Meeting Room View ────────────────────────────── -->
    <div id="meeting-view" class="hidden meeting-layout">

        <!-- Header -->
        <header class="meet-header glass">
            <div class="meet-brand">
                <svg width="28" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="url(#g3)"/><path d="M20 14v6l4 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><defs><linearGradient id="g3" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs></svg>
                <span class="meet-brand-name">NexLink</span>
            </div>
            <div id="room-chip" class="chip glass">📡 <span id="room-display"></span></div>
            <div class="meet-actions">
                <span id="participant-count" class="chip glass">👥 1</span>
                <button id="leave-btn" class="btn-danger">Leave</button>
            </div>
        </header>

        <!-- Main content area -->
        <main class="meet-main">
            <!-- Video Grid -->
            <div id="video-grid" class="video-grid">
                <div class="video-tile glass" id="local-tile">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="video-label">You</div>
                    <div class="video-overlay" id="local-cam-off">Camera Off</div>
                </div>
            </div>

            <!-- Whiteboard Panel -->
            <div id="whiteboard-panel" class="wb-panel hidden glass">
                <div class="wb-toolbar glass">
                    <label class="wb-tool" title="Color">
                        <input type="color" id="wb-color" value="#7c3aed">
                        <span>🎨</span>
                    </label>
                    <label class="wb-tool" title="Brush Size">
                        <input type="range" id="wb-size" min="1" max="20" value="3" style="width:80px">
                    </label>
                    <button class="wb-tool" id="wb-eraser" title="Eraser">◽ Eraser</button>
                    <button class="wb-tool" id="wb-clear" title="Clear">🗑 Clear</button>
                </div>
                <canvas id="whiteboard"></canvas>
            </div>

            <!-- File Panel -->
            <aside id="file-panel" class="file-panel hidden glass">
                <h3>📁 Shared Files</h3>
                <input type="file" id="file-input" class="hidden">
                <button id="share-file-btn" class="btn-primary" style="width:100%;margin:12px 0">
                    ↑ Share a File
                </button>
                <div id="file-list" class="file-list"></div>
            </aside>

            <!-- Chat Panel -->
            <aside id="chat-panel" class="chat-panel hidden glass">
                <h3>💬 Room Chat</h3>
                <div id="chat-messages" class="chat-messages"></div>
                <form id="chat-form" class="chat-form">
                    <input type="text" id="chat-input" placeholder="Type a message…" autocomplete="off">
                    <button type="submit" class="chat-send-btn" title="Send">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
            </aside>
        </main>

        <!-- Controls Bar -->
        <footer class="controls-bar glass">
            <button class="ctrl-btn" id="toggle-mic" title="Mute / Unmute">
                <svg class="ctrl-icon" id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                <span class="ctrl-label">Mic</span>
            </button>
            <button class="ctrl-btn" id="toggle-cam" title="Camera On / Off">
                <svg class="ctrl-icon" id="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <span class="ctrl-label">Camera</span>
            </button>
            <button class="ctrl-btn" id="share-screen" title="Share Screen">
                <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span class="ctrl-label">Screen</span>
            </button>
            <button class="ctrl-btn" id="toggle-whiteboard" title="Toggle Whiteboard">
                <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <span class="ctrl-label">Board</span>
            </button>
            <button class="ctrl-btn" id="toggle-files" title="File Sharing">
                <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="ctrl-label">Files</span>
            </button>
            <button class="ctrl-btn" id="toggle-chat" title="Room Chat">
                <svg class="ctrl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="ctrl-label">Chat</span>
                <span id="chat-badge" class="chat-badge hidden">0</span>
            </button>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="./main.js"></script>
</body>
</html>
