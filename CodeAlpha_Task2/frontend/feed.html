<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavely</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">
  <!-- Left Nav -->
  <nav class="left-nav">
    <div class="nav-logo">Wavely</div>
    <div class="nav-links">
      <a href="feed.html" class="nav-item active">
        <span class="nav-icon">🏠</span><span>Home</span>
      </a>
      <a href="#" class="nav-item" onclick="focusCreate(event)">
        <span class="nav-icon">➕</span><span>Create</span>
      </a>
      <a href="#" class="nav-item" id="nav-profile-link">
        <span class="nav-icon">👤</span><span>Profile</span>
      </a>
    </div>
    <button class="nav-item nav-logout" onclick="logout()">
      <span class="nav-icon">🚪</span><span>Logout</span>
    </button>
  </nav>

  <!-- Center Feed -->
  <div class="page-content">
    <div class="feed-center">
      <!-- Stories -->
      <div class="stories-bar" id="stories-bar"></div>

      <!-- Create Post -->
      <div class="create-post-card" id="create-post-card">
        <div class="post-avatar" id="create-avatar" style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;"></div>
        <div style="flex:1">
          <textarea id="post-content" rows="2" placeholder="Share a moment..."></textarea>
          <div class="create-post-footer">
            <span style="font-size:12px;color:#8e8e8e" id="char-ct">0/280</span>
            <button class="btn-ig-primary" id="post-btn" onclick="createPost()">Share</button>
          </div>
        </div>
      </div>

      <!-- Feed -->
      <div id="feed">
        <div class="skeleton skeleton-post"></div>
        <div class="skeleton skeleton-post"></div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="right-profile-mini" id="rp-mini"></div>
      <div class="suggest-title">
        <span>Suggested for you</span>
      </div>
      <div id="suggestions"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  requireAuth();
  // Set nav profile link
  document.getElementById('nav-profile-link').href = `profile.html?user=${me()}`;
  initFeedPage();
</script>
</body>
</html>
